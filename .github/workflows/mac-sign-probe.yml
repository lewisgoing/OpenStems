name: mac-sign-probe

# Throwaway: can the Mac runner sign with the self-signed certificate in CSC_LINK? It prints
# only counts, the certificate's name and what codesign says about a signed copy of /bin/ls.
# Never the certificate, the key or the password. Runs on a push to this branch only.
on:
  push:
    branches: [mac-self-signed]
    paths: [.github/workflows/mac-sign-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Probe
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -u
          [ -n "$CSC_LINK" ] && echo "CSC_LINK: set (${#CSC_LINK} characters)" || echo "CSC_LINK: EMPTY"
          [ -n "$CSC_KEY_PASSWORD" ] && echo "CSC_KEY_PASSWORD: set" || echo "CSC_KEY_PASSWORD: EMPTY"
          work="$RUNNER_TEMP/probe"; mkdir -p "$work"; cd "$work"
          echo "$CSC_LINK" | base64 --decode > cert.p12
          kc="$work/probe.keychain-db"; kcpw="probe-$RANDOM$RANDOM"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          if security import cert.p12 -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null; then
            echo "import: ok"
          else
            echo "import: FAILED (wrong password, or a format the keychain cannot read)"; exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "--- identities, valid only (what electron-builder reads)"
          security find-identity -v -p codesigning "$kc" | sed -E 's/[0-9A-F]{40}/<hash>/'
          echo "--- identities, all"
          security find-identity -p codesigning "$kc" | sed -E 's/[0-9A-F]{40}/<hash>/'
          hash=$(security find-identity -p codesigning "$kc" | grep -m1 -oE '[0-9A-F]{40}')
          cp /bin/ls ./probe-ls
          echo "--- codesign with the untrusted identity, by hash"
          if codesign --force --sign "$hash" --keychain "$kc" --timestamp=none ./probe-ls; then echo "sign: ok"; else echo "sign: FAILED"; fi
          codesign -dv --verbose=2 ./probe-ls 2>&1 | grep -E '^(Authority|Signature|TeamIdentifier|Identifier)='
          codesign -d -r- ./probe-ls 2>&1 | grep -E 'designated' | sed -E 's/H"[0-9a-f]{40}"/H"<hash>"/'
          codesign --verify --strict ./probe-ls && echo "verify: ok" || echo "verify: FAILED"
          echo "--- trust it on the runner, then look again"
          security find-certificate -c "" -p "$kc" > cert.pem 2>/dev/null || true
          if [ -s cert.pem ] && sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem; then
            echo "trust: ok"
          else
            echo "trust: FAILED"
          fi
          security find-identity -v -p codesigning "$kc" | sed -E 's/[0-9A-F]{40}/<hash>/'
          security delete-keychain "$kc"
