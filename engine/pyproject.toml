[project]
name = "openstems"
version = "0.3.6"
description = "Local GPU stem separation: engine, CLI and local API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "torch>=2.9",
    "numpy>=2.1",
    "av>=19.0",
    "typer>=0.29",
    "rich>=14",
    "bs-roformer-infer==0.1.5",
    "soundfile>=0.14",
    "httpx>=0.28",
    "pyyaml>=6",
    "ml-collections>=1.1",
    "melband-roformer-infer",
    "mdxnet-infer",
    "fastapi>=0.165",
    "uvicorn>=0.54",
    "websockets>=15",
    "librosa>=0.11",
    "yt-dlp[default,deno]==2026.11.23",
]

[project.scripts]
openstems = "openstems.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.17",
    "pyright>=1.1.414",
    "pytest>=9",
    "pytest-timeout>=2.3",
]
# One PyTorch build per kind of GPU. `uv sync` installs `cuda`; the packaged app installs the
# group that matches the machine (docs/adr/0007-amd-rocm.md, docs/adr/0012-older-nvidia.md).
cuda = ["torch==2.14.1"]
# The same PyTorch for CUDA 12.6: the build that still carries GTX 900-series, GTX 10-series
# and Titan V cards. It cannot run a 50-series card.
cu126 = ["torch==2.14.1"]
# Apple Silicon: the same PyTorch from PyPI, whose macOS wheel carries the MPS backend
# (docs/adr/0014-macos.md).
mps = ["torch==2.14.1"]
rocm = [
    "torch==2.9.1+rocm7.2.1",
    "rocm[libraries]==7.2.1",
    "rocm-sdk-core==7.2.1",
    "rocm-sdk-libraries-custom==7.2.1",
]

[tool.uv]
default-groups = ["dev", "cuda"]
conflicts = [[{ group = "cuda" }, { group = "cu126" }, { group = "rocm" }, { group = "mps" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openstems"]

# NVIDIA: PyTorch from the CUDA 13.0 wheel index (50-series cards need CUDA >= 12.8).
# AMD: AMD's own PyTorch-on-Windows build and its ROCm runtime, from repo.radeon.com.
# Apple Silicon (the `mps` group) has no entry here: its PyTorch comes from PyPI.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", group = "cuda" },
    { index = "pytorch-cu126", group = "cu126" },
    { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/torch-2.9.1%2Brocm7.2.1-cp312-cp312-win_amd64.whl", group = "rocm" },
]
rocm = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm-7.2.1.tar.gz" }
rocm-sdk-core = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_core-7.2.1-py3-none-win_amd64.whl" }
rocm-sdk-libraries-custom = { url = "https://repo.radeon.com/rocm/windows/rocm-rel-7.2.1/rocm_sdk_libraries_custom-7.2.1-py3-none-win_amd64.whl" }
bs-roformer-infer = { git = "https://github.com/openmirlab/bs-roformer-infer", rev = "e3ad851fb24333ae36ae4bfd5ec327dbbf764bea" }
melband-roformer-infer = { git = "https://github.com/openmirlab/melband-roformer-infer", rev = "02099e62325506a1a52d81a923f5f678bdc9285d" }
mdxnet-infer = { git = "https://github.com/openmirlab/mdxnet-infer", rev = "cb4779eedeca4f55ba498df8e234e2b5f4b90aaf" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # non-ASCII text is deliberate (file names, docs)

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU (CUDA, ROCm or MPS) and downloaded models (deselected in CI)"]
addopts = "-m 'not gpu'"
timeout = 180
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
