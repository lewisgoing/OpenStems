id = "full-song-best-vocals-alt"
name = "Full song, best vocals (SW on the instrumental)"
version = 1
use_case = "Full song"
description = "The second wiring: SW runs on the Leap Xe instrumental instead of the mix. For A/B listening against full-song-best-vocals."
residual_into = "other"
experimental = true

[[passes]]
id = "vox"
model = "bs-roformer-leap-xe-vocals"
input = "mix"

[[passes]]
id = "inst"
model = "bs-roformer-leap-xe-instrumental"
input = "mix"

[[passes]]
id = "sw"
model = "bs-roformer-sw"
input = "inst.instrumental"

[[outputs]]
stem = "vocals"
from = "vox.vocals"

[[outputs]]
stem = "drums"
from = "sw.drums"

[[outputs]]
stem = "bass"
from = "sw.bass"

[[outputs]]
stem = "guitar"
from = "sw.guitar"

[[outputs]]
stem = "piano"
from = "sw.piano"

[[outputs]]
stem = "other"
from = "sw.other"
